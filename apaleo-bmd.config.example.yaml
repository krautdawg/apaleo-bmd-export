# Konfiguration für apaleo-bmd-export
#
# Kopiere diese Datei nach apaleo-bmd.config.yaml und bearbeite sie. Das Tool
# sucht die Datei aus --config, sonst aus APALEO_BMD_CONFIG, sonst
# ./apaleo-bmd.config.yaml. JSON geht auch, wenn der Dateiname auf .json endet.
#
# Secrets kommen nie in diese Datei. Setze sie in der Umgebung (zum Beispiel in .env):
#   APALEO_CLIENT_SECRET   das Client-Secret deiner apaleo Custom App
#
# Diese Einstellungen lassen sich auch aus der Umgebung setzen (nur einzelne Werte):
#   APALEO_BMD_OUTPUT_DIR   -> output.dir
#   APALEO_CLIENT_ID        -> apaleo.clientId
#   APALEO_BMD_TIMEZONE     -> schedule.timezone

apaleo:
  # Client-ID der Custom App, die du unter Apps > Connected apps angelegt hast.
  # Trag sie hier ein oder setze APALEO_CLIENT_ID. Erforderliche Berechtigungen:
  # siehe docs/setup-apaleo.md.
  clientId:
  # Nur für Clients, die Scopes statt Berechtigungen nutzen, zum Beispiel:
  # scopes: accounting.read
  # Ändere diese Werte nur, um gegen eine andere apaleo-Umgebung zu testen. Sie
  # müssen https sein (einfaches http nur für localhost):
  # baseUrl: https://api.apaleo.com
  # identityUrl: https://identity.apaleo.com

# Was der BMD-Mandant der Kanzlei festlegt. Frag deine Kanzlei.
bmd:
  # Das Buchungssymbol jeder Buchung. Es hat absichtlich keinen Standardwert:
  # Die Kanzlei muss es in BMD zuerst anlegen (zum Beispiel HO, kopiert von AR mit
  # allen Kontenarten erlaubt), sonst lehnt BMD den Import ab. Siehe docs/bmd-import.md.
  # 1 bis 4 Zeichen A-Z und 0-9 (mit dialect bmd55 höchstens 2).
  buchsymbol: HO
  # Optional: ein eigenes Buchungssymbol für Zahlungen (Buchungstyp Zahlung).
  # Ohne Angabe gilt buchsymbol.
  # buchsymbolZahlung: HZ
  # Sachkontenlänge im Kontenplan der Kanzlei, 4 bis 9. Der EKR nutzt 4.
  sachkontenlaenge: 4
  # Personenkontenlänge (Debitoren), 5 bis 9, zum Beispiel 6 für 200000.
  personenkontenlaenge: 6
  # "ntcs" für BMD NTCS (Standard) oder "bmd55" für BMD 5.5 (andere Spaltennamen,
  # Datum JJJJMMTT und Steuercode 3 statt 1 für die Umsatzsteuer).
  dialect: ntcs

posting:
  # Was in extbelegnr steht, der externen Belegnummer, mit der BMD offene Posten
  # zuordnet: "receipt" nimmt den Beleg aus apaleo (Rechnung, Zahlungsreferenz)
  # und sonst die Reservierungsreferenz; "reference" nimmt immer die
  # Reservierungsreferenz.
  extbelegnr: receipt

output:
  # Ordner für die erzeugten BMD-Dateien, relativ zum Arbeitsverzeichnis.
  dir: ./exports

# Die apaleo-Hotels, mit denen das Tool arbeitet, jedes mit seiner Kontenzuordnung
# (CSV, relativ zum Arbeitsverzeichnis; Standard ./mapping-<id>.csv). Leg die
# Kontenzuordnung mit "apaleo-bmd init-mapping --property BSP --template ekr" an
# und lass sie von deiner Steuerberatung prüfen. Die IDs listet "apaleo-bmd properties".
# "apaleo-bmd export --month 2026-10" exportiert jedes hier eingetragene Hotel.
# Bucht die Kanzlei zwei Hotels in einen Mandanten, braucht jedes ein eigenes
# Buchungssymbol, sonst wiederholen sich die Belegnummern (W-BUCHSYMBOL-SHARED).
# properties:
#   - id: BSP
#     mapping: ./mapping-BSP.csv
#   - id: BSP2
#     mapping: ./mapping-BSP2.csv
#     buchsymbol: HO2

checks:
  # Vergleicht das Buchungsjournal zusätzlich mit den Tagessummen von apaleo pro
  # Hauptkonto und warnt bei Abweichungen (W-AGGREGATE-DIFF). Standardmäßig aus:
  # Es braucht die optionale Berechtigung core.subledger_aggregate.create und
  # eine zusätzliche Anfrage pro Tag.
  aggregates: false

# "apaleo-bmd schedule --once" exportiert jeden fälligen Zeitraum, der noch nicht
# im Ausgabeordner liegt, und endet. Starte es per Cron oder mit der Docker-Compose-
# Schleife (docs/docker.md); stündlich ist unbedenklich.
schedule:
  # "Heute" ist das Datum in dieser IANA-Zeitzone (Standard Europe/Vienna).
  # Auch APALEO_BMD_TIMEZONE.
  timezone: Europe/Vienna
  # Ein Rhythmus pro Installation, damit nie tägliche und monatliche Dateien bei
  # BMD ankommen: "monthly" (eine Importdatei pro Monat für die Kanzlei) oder "daily"
  # (etwa 30 Importe im Monat).
  cadence: monthly
  monthly:
    # Ein Monat ist ab diesem Tag des Folgemonats fällig (1 bis 5). Bei 1 oder 2
    # wartet er bis zum 2. um 06:00 Uhr (siehe finalAfter).
    dayOfMonth: 3
  daily:
    # Ein Tag ist so viele Tage später fällig (1 bis 3); 2 = vorgestern.
    # Bei 1 wird gestern als "not yet final" gemeldet und später exportiert.
    offsetDays: 2
  # apaleo kann auf einen Tag noch buchen, bis der Tagesabschluss (Night Audit)
  # den folgenden Tag schließt, und der läuft nach Mitternacht. Ein Zeitraum, der
  # am Tag T endet, ist deshalb ab dieser Ortszeit am Tag T+2 abgeschlossen und
  # wird dann exportiert ("00:00" bis "12:00", in Anführungszeichen). Bis dahin
  # meldet das Tool ihn als "not yet final". Setze den Wert auf die Uhrzeit, zu
  # der dein Tagesabschluss fertig ist.
  finalAfter: "06:00"
  # Wie viele Tage zurück ein verpasster Zeitraum nach einem Ausfall noch exportiert
  # wird (mindestens 3 bei monatlich, 5 bei täglich). Beim ersten Lauf wird jeder
  # Zeitraum exportiert, der in diesem Fenster fällig ist: Setze den Wert für den
  # ersten Lauf niedriger, wenn ein früheres Tool diese Monate schon geliefert hat.
  catchUpDays: 40
